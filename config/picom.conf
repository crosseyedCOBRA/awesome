# Base picom config for this Awesome session (picom v12+ `rules` syntax).
# Deployed to ~/.config/picom/picom.conf; started from rc.lua.

# GLX on the AMD card, with vsync to stop tearing on the 144/165Hz panels.
backend = "glx";
vsync = true;
use-damage = true;

# Shadows: soft and subtle, to sit under Awesome's 2px borders and 4px gaps.
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.5;

# Short fades on open/close and when changing tags.
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;

# Square corners, matching the theme's plain borders.
corner-radius = 0;

detect-client-opacity = true;
detect-transient = true;
detect-rounded-corners = true;

rules: ({
  # The quickshell bar and the desktop: flat, no shadow or fade.
  match = "window_type = 'dock' || window_type = 'desktop'";
  shadow = false;
  fade = false;
}, {
  # Menus and tooltips pop in without a shadow box around them.
  match = "window_type = 'dropdown_menu' || window_type = 'popup_menu' || "
          "window_type = 'menu' || window_type = 'tooltip'";
  shadow = false;
}, {
  # flameshot's fullscreen capture overlay must stay exactly as drawn,
  # and GTK client-side-decorated windows draw their own shadows.
  match = "class_g = 'flameshot' || _GTK_FRAME_EXTENTS@";
  shadow = false;
  fade = false;
}, {
  # Fullscreen windows (games, video) are left alone.
  match = "fullscreen";
  shadow = false;
});
